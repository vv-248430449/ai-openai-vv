<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多模态聊天</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 760px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 0 0 24px rgba(0,0,0,.06);
    }
    .header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: linear-gradient(135deg, #4f7cff, #6a5cff);
      color: #fff;
    }
    .header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .header button {
      border: none;
      background: rgba(255,255,255,.22);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .header button:hover { background: rgba(255,255,255,.34); }
    .messages {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .row.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.user .bubble {
      background: #4f7cff;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .row.assistant .bubble {
      background: #f1f3f7;
      color: #1f2329;
      border-bottom-left-radius: 4px;
    }
    .bubble img {
      max-width: 240px;
      max-height: 240px;
      border-radius: 8px;
      display: block;
      margin-top: 6px;
    }
    .bubble.thinking { color: #8a8f99; font-style: italic; }
    .bubble.error { background: #ffe9e9; color: #c0392b; }
    .input-bar {
      flex: 0 0 auto;
      border-top: 1px solid #eceef2;
      padding: 12px 14px;
      background: #fafbfc;
    }
    .preview {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
      color: #555;
    }
    .preview.show { display: flex; }
    .preview img {
      width: 46px; height: 46px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    .preview .remove {
      cursor: pointer;
      color: #c0392b;
      border: 1px solid #f0c0c0;
      border-radius: 6px;
      padding: 1px 7px;
    }
    .composer { display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea {
      flex: 1 1 auto;
      resize: none;
      height: 44px;
      max-height: 120px;
      padding: 10px 12px;
      border: 1px solid #d9dde3;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .composer textarea:focus { border-color: #4f7cff; }
    .icon-btn, .send-btn {
      flex: 0 0 auto;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      height: 44px;
      font-size: 14px;
    }
    .icon-btn {
      width: 44px;
      background: #eef1f6;
      color: #4f7cff;
      font-size: 20px;
      line-height: 1;
    }
    .send-btn {
      padding: 0 18px;
      background: #4f7cff;
      color: #fff;
      font-weight: 600;
    }
    .send-btn:disabled { background: #aebfe6; cursor: not-allowed; }
    .hint { font-size: 12px; color: #9aa0a8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Deep-Seek Chat</h1>
      <button id="newChat">新对话</button>
    </div>

    <div class="messages" id="messages">
      <div class="row assistant">
        <div class="bubble">你好，我是Deep-Seek多模态助手。可以发文字，也可以带一张图片问我～</div>
      </div>
    </div>

    <div class="input-bar">
      <div class="preview" id="preview">
        <img id="previewImg" alt="预览" />
        <span id="previewName"></span>
        <span class="remove" id="removeImg">移除</span>
      </div>
      <div class="composer">
        <textarea id="text" placeholder="输入文字（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="icon-btn" id="pickImg" title="选择图片">🖼️</button>
        <button class="send-btn" id="send">发送</button>
      </div>
      <div class="hint">图片可选；多轮对话会自动记住上下文，「新对话」会清空记忆。</div>
      <input type="file" id="file" accept="image/*" hidden />
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const messages = $('messages');
    const textEl = $('text');
    const fileEl = $('file');
    let selectedFile = null;
    let conversationId = '';

    function scrollBottom() { messages.scrollTop = messages.scrollHeight; }

    function addBubble(role, html, cls) {
      const row = document.createElement('div');
      row.className = 'row ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (cls ? ' ' + cls : '');
      bubble.innerHTML = html;
      row.appendChild(bubble);
      messages.appendChild(row);
      scrollBottom();
      return bubble;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function showPreview() {
      const box = $('preview');
      if (selectedFile) {
        const url = URL.createObjectURL(selectedFile);
        $('previewImg').src = url;
        $('previewName').textContent = selectedFile.name;
        box.classList.add('show');
      } else {
        box.classList.remove('show');
        $('previewImg').src = '';
      }
    }

    $('pickImg').addEventListener('click', () => fileEl.click());
    fileEl.addEventListener('change', () => {
      selectedFile = fileEl.files[0] || null;
      showPreview();
    });
    $('removeImg').addEventListener('click', () => {
      selectedFile = null;
      fileEl.value = '';
      showPreview();
    });

    $('newChat').addEventListener('click', () => {
      conversationId = '';
      messages.innerHTML = '';
      addBubble('assistant', '已开启新对话，上下文已清空。');
    });

    textEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    $('send').addEventListener('click', send);

    async function send() {
      const message = textEl.value.trim();
      if (!message && !selectedFile) return;

      // 用户气泡（含图片缩略图）
      let userHtml = escapeHtml(message || '（图片）');
      if (selectedFile) {
        const url = URL.createObjectURL(selectedFile);
        userHtml += '<img src="' + url + '" alt="上传图片">';
      }
      addBubble('user', userHtml);

      // 暂存输入，清空输入框
      const formData = new FormData();
      formData.append('message', message || '请描述这张图片');
      if (selectedFile) formData.append('image', selectedFile);
      if (conversationId) formData.append('conversationId', conversationId);

      textEl.value = '';
      selectedFile = null;
      fileEl.value = '';
      showPreview();

      const thinking = addBubble('assistant', '思考中…', 'thinking');
      $('send').disabled = true;

      try {
        const resp = await fetch('/ai/chat/multimodal', { method: 'POST', body: formData });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        conversationId = data.conversationId || conversationId;
        thinking.className = 'bubble';
        thinking.textContent = data.reply;
      } catch (err) {
        thinking.className = 'bubble error';
        thinking.textContent = '出错了：' + err.message + '\n（检查后端是否启动、OPENAI_KEY 是否配置）';
      } finally {
        $('send').disabled = false;
        scrollBottom();
      }
    }
  </script>
</body>
</html>
