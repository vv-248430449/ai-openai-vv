# .github/workflows/ci.yml
# 最小可用 CI：每次 push / PR 到 main，用 JDK17 跑 `mvn test`，
# 其中的 AiEvalTest 会在配置了 OPENAI_KEY secret 时真实调用大模型做 eval。
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 注：本仓库的 ./mvnw 目前是空文件（0 字节），故直接用 runner 自带的 mvn。
      # 若日后修好 mvnw，把下面这行换成 `./mvnw -B test` 即可。
      - name: Build & run tests (eval)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: mvn -B test
