# .github/workflows/ci.yml
# 最小可用 CI：每次 push / PR 到 main，用 JDK17 跑 `mvn -B test`，
# 其中 AiEvalTest 会真实调用大模型做 eval（必须配置 OPENAI_KEY，否则标红）。
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 本地与 CI 统一用 mvn -B test（GitHub ubuntu runner 自带 mvn；本机已装 Maven 同理）
      - name: Build & run tests (eval)
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: mvn -B test
